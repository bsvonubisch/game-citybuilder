<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <title>Turning animation audit</title>
  <style>
    body {
      margin: 24px;
      background: #f4f1e6;
      color: #304b3a;
      font: 16px system-ui;
    }
    h1 {
      font: 28px Georgia;
      margin: 0 0 8px;
    }
    p {
      margin: 8px 0 16px;
    }
    button,
    input {
      font: inherit;
      padding: 8px;
      vertical-align: middle;
    }
    input {
      width: 360px;
    }
    main {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    article {
      border-radius: 10px;
      background: #dce4cf;
      overflow: hidden;
    }
    h2 {
      font-size: 14px;
      margin: 14px;
    }
    canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
    }
    output {
      margin-left: 14px;
    }
  </style>
  <h1>Turning animation audit</h1>
  <p>
    Actual lane curves and eight upright facing views. Both turn directions in
    every orientation.
  </p>
  <button id="play">Play turns</button>
  <label
    >Route position
    <input id="distance" type="range" min="2" max="4" step="0.01" value="3"
  /></label>
  <output id="position">Corner midpoint</output>
  <main></main>
  <script type="module" src="./turns.ts"></script>
</html>
